<!doctype html>
<html lang="hi" data-default-lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saaf Paani · Staff entry</title>
<meta name="theme-color" content="#f3eee4">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Gurmukhi:wght@400;500;600;700&family=Tiro+Devanagari+Hindi:ital@0;1&family=Tiro+Gurmukhi:ital@0;1&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top"><div class="wrap"><div id="brand"></div><div id="lang" class="lang" role="group" aria-label="Language"></div></div></header>

<main class="wrap" style="max-width:640px">
  <form id="form" novalidate>
    <h1 class="staff-title" data-i18n="staffEntry"></h1>

    <section class="step" id="s-hostel">
      <h2><span class="n">1</span><span data-i18n="step1"></span></h2>
      <div class="choices two" id="hostels"></div>
    </section>

    <section class="step" id="s-floor">
      <h2><span class="n">2</span><span data-i18n="step2"></span></h2>
      <div class="choices floorsel" id="floors"></div>
    </section>

    <section class="step" id="s-type">
      <h2><span class="n">3</span><span data-i18n="step3"></span></h2>
      <p class="sub" data-i18n="step3hint"></p>
      <div class="choices three" id="types"></div>
    </section>

    <section class="step" id="s-date">
      <h2><span class="n">4</span><span data-i18n="step4"></span></h2>
      <div class="choices three" id="dates"></div>
      <div class="field" id="otherDateWrap" hidden style="margin-top:12px">
        <input type="date" id="otherDate" aria-label="date">
      </div>
    </section>

    <section class="step" id="s-media">
      <h2><span class="n">5</span><span data-i18n="mediaStep"></span></h2>
      <p class="sub" data-i18n="mediaHint"></p>
      <div class="media-pick" id="mediaList"></div>
      <label class="add-media" id="addMedia">
        <input type="file" id="fileInput" accept="image/*,video/*" multiple>
        <span class="ic" id="camIcon"></span><span data-i18n="addMedia"></span>
      </label>
      <p class="media-msg" id="mediaMsg" role="status"></p>
    </section>

    <section class="step">
      <h2><span class="n">6</span><span data-i18n="step5"></span></h2>
      <div class="field"><label for="name" data-i18n="yourName"></label><input id="name" autocomplete="name" maxlength="40"></div>
      <div class="field" style="margin:0"><label for="witness" data-i18n="studentName"></label><input id="witness" maxlength="40"></div>
    </section>

    <div class="savebar">
      <p class="msg" id="msg" role="alert"></p>
      <button class="btn primary" id="save" type="submit"><span data-i18n="save"></span></button>
    </div>
  </form>

  <section id="done" class="done" hidden>
    <div class="big"></div>
    <h2 data-i18n="saved"></h2>
    <p id="doneText"></p>
    <div class="cta">
      <button class="btn primary" id="again" type="button"><span data-i18n="addAnother"></span></button>
      <a class="btn ghost" id="viewFloor" href="#"><span data-i18n="viewFloor"></span></a>
    </div>
  </section>
</main>

<footer class="foot"><div class="wrap"><span data-i18n="footer"></span><button type="button" class="linkbtn" id="lock" data-i18n="lockPhone"></button></div></footer>

<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  const { CFG, TYPES, ICONS, API, store, t, esc, todayISO, addDays, fmtDate, mountChrome, gate, lockPhone, compressImage } = SP;
  mountChrome();
  const MAX_FILES = 6, MAX_VIDEO = 20 * 1024 * 1024;

  const state = {
    hostel: store.get("sp_staff_hostel", null),
    floor: null,
    types: new Set(),
    when: "today",
    files: []   // { file, url, kind }
  };
  let pin = "";
  const $ = id => document.getElementById(id);
  $("name").value = store.get("sp_staff_name", "");
  $("otherDate").max = todayISO();
  $("otherDate").value = todayISO();
  $("camIcon").innerHTML = ICONS.camera;
  document.querySelector("#done .big").innerHTML = ICONS.check;
  $("lock").onclick = lockPhone;

  const tick = `<span class="tick">${ICONS.check}</span>`;

  function render() {
    $("hostels").innerHTML = CFG.HOSTELS.map(h =>
      `<button type="button" class="choice ${state.hostel === h ? "on" : ""}" data-v="${h}" aria-pressed="${state.hostel === h}">${tick}${ICONS[h]}<span>${esc(t(h))}</span></button>`).join("");
    $("floors").innerHTML = Array.from({ length: CFG.FLOORS }, (_, i) => i + 1).map(f =>
      `<button type="button" class="choice ${state.floor === f ? "on" : ""}" data-v="${f}" aria-pressed="${state.floor === f}" aria-label="${esc(t("floorN", { n: f }))}">${f}</button>`).join("");
    $("types").innerHTML = TYPES.map(ty =>
      `<button type="button" class="choice ${state.types.has(ty) ? "on" : ""}" data-v="${ty}" aria-pressed="${state.types.has(ty)}">${tick}${ICONS[ty]}<span>${esc(t("act_" + ty))}</span></button>`).join("");
    $("dates").innerHTML = [["today", t("today")], ["yesterday", t("yesterday")], ["other", t("other")]].map(([v, l]) =>
      `<button type="button" class="choice ${state.when === v ? "on" : ""}" data-v="${v}" aria-pressed="${state.when === v}">${esc(l)}</button>`).join("");
    $("otherDateWrap").hidden = state.when !== "other";
    renderMedia();

    $("hostels").querySelectorAll(".choice").forEach(b => b.onclick = () => { state.hostel = b.dataset.v; clearMissing("s-hostel"); render(); });
    $("floors").querySelectorAll(".choice").forEach(b => b.onclick = () => { state.floor = Number(b.dataset.v); clearMissing("s-floor"); render(); });
    $("types").querySelectorAll(".choice").forEach(b => b.onclick = () => {
      const v = b.dataset.v; state.types.has(v) ? state.types.delete(v) : state.types.add(v); clearMissing("s-type"); render();
    });
    $("dates").querySelectorAll(".choice").forEach(b => b.onclick = () => { state.when = b.dataset.v; render(); });
  }

  function renderMedia() {
    $("mediaList").innerHTML = state.files.map((m, i) =>
      `<div class="mthumb">
        ${m.kind === "video" ? `<video src="${m.url}" muted playsinline preload="metadata"></video><span class="play">${ICONS.play}</span>` : `<img src="${m.url}" alt="">`}
        <button type="button" class="rm" data-i="${i}" aria-label="${esc(t("close"))}">${ICONS.x}</button>
      </div>`).join("");
    $("mediaList").querySelectorAll(".rm").forEach(b => b.onclick = () => {
      const [m] = state.files.splice(Number(b.dataset.i), 1);
      URL.revokeObjectURL(m.url);
      $("mediaMsg").textContent = "";
      renderMedia();
    });
    $("addMedia").hidden = state.files.length >= MAX_FILES;
  }

  $("fileInput").onchange = ev => {
    let note = "";
    [...ev.target.files].forEach(file => {
      const kind = file.type.startsWith("video/") ? "video" : file.type.startsWith("image/") ? "image" : null;
      if (!kind) return;
      if (state.files.length >= MAX_FILES) { note = t("maxFiles"); return; }
      if (kind === "video" && file.size > MAX_VIDEO) { note = t("tooBig"); return; }
      state.files.push({ file, kind, url: URL.createObjectURL(file) });
    });
    ev.target.value = "";
    $("mediaMsg").textContent = note;
    renderMedia();
  };

  function clearMissing(id) { $(id).classList.remove("missing"); $("msg").textContent = ""; }
  function dateValue() {
    if (state.when === "today") return todayISO();
    if (state.when === "yesterday") return addDays(todayISO(), -1);
    return $("otherDate").value || todayISO();
  }
  function setBtn(label, busy) {
    const btn = $("save");
    btn.disabled = !!busy;
    btn.querySelector("span").textContent = label;
  }
  function failed(res) {
    setBtn(t("save"), false);
    if (res && res.error === "bad_pin") { lockPhone(); return; }
    $("msg").textContent = t(res && res.error === "locked" ? "lockedOut" : res && res.error === "upload" ? "uploadError" : "saveError");
  }

  $("form").onsubmit = async ev => {
    ev.preventDefault();
    const checks = [
      [!state.hostel, "s-hostel", "missingHostel"],
      [!state.floor, "s-floor", "missingFloor"],
      [!state.types.size, "s-type", "missingType"]
    ];
    const miss = checks.find(c => c[0]);
    if (miss) {
      $(miss[1]).classList.add("missing");
      $(miss[1]).scrollIntoView({ behavior: "smooth", block: "center" });
      $("msg").textContent = t(miss[2]);
      return;
    }
    $("msg").textContent = "";

    // 1) upload photos/videos one by one (each is its own request, so big videos don't block photos)
    const media = [];
    for (let i = 0; i < state.files.length; i++) {
      const m = state.files[i];
      if (m.uploaded) { media.push(m.uploaded); continue; }
      setBtn(t("uploading", { i: i + 1, n: state.files.length }), true);
      let r;
      try {
        const blob = m.kind === "image" ? await compressImage(m.file) : m.file;
        r = await API.upload(pin, state.hostel, state.floor, blob);
      } catch (e) { r = { ok: false, error: "upload" }; }
      if (!r || !r.ok) return failed(r && r.error === "bad_pin" ? r : { error: r && r.error === "locked" ? "locked" : "upload" });
      m.uploaded = { id: r.id, type: r.type };
      media.push(m.uploaded);
    }

    // 2) save the entry
    setBtn(t("saving"), true);
    const payload = {
      pin, hostel: state.hostel, floor: state.floor, types: [...state.types], date: dateValue(),
      name: $("name").value.trim(), witness: $("witness").value.trim(), media
    };
    let res;
    try { res = await API.add(payload); } catch (e) { res = { ok: false, error: "network" }; }
    if (!res || !res.ok) return failed(res);

    setBtn(t("save"), false);
    store.set("sp_staff_hostel", state.hostel);
    store.set("sp_staff_name", payload.name);
    $("doneText").textContent = payload.types.map(ty => t("act_" + ty)).join(" · ") + " — " +
      t(state.hostel) + ", " + t("floorN", { n: state.floor }) + ", " + fmtDate(payload.date) +
      (media.length ? " · " + media.length + " 📷" : "");
    $("viewFloor").href = "floor.html?h=" + state.hostel + "&f=" + state.floor;
    $("form").hidden = true; $("done").hidden = false;
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  $("again").onclick = () => {
    state.floor = null; state.types.clear(); state.when = "today";
    state.files.forEach(m => URL.revokeObjectURL(m.url)); state.files = [];
    $("witness").value = ""; $("mediaMsg").textContent = "";
    $("done").hidden = true; $("form").hidden = false;
    render(); window.scrollTo({ top: 0 });
  };

  document.addEventListener("langchange", render);
  gate(p => { pin = p; render(); });
})();
</script>
</body>
</html>
